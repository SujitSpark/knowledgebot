name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Guardrail unit tests
        run: npm test

  evals-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate golden dataset and compile eval code
        run: |
          python -c "import json; c=json.load(open('evals/golden_dataset.json'))['cases']; assert len(c) >= 25; print(len(c), 'cases')"
          python -m py_compile evals/*.py
